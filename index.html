  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.7;color:#8a8a86;padding-top:6px;border-top:1px solid #1f1f1d\">Pass/fail gives a model one bit per attempt. Ordering by what was actually established gives it a gradient. You build that loop — with a proof checker inside it.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:18px\">\n      <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66\">the bar · all required<\u002Fspan>\n      <div style=\"display:grid;border-top:1px solid #1f1f1d\">\n        <div style=\"display:grid;grid-template-columns:2.2em 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #1f1f1d;font-size:14px;line-height:1.65;color:#c9c9c4\"><span style=\"color:#6a6a66\">⊢<\u002Fspan><span>You have trained or fine‑tuned frontier‑scale models end to end, and can show the runs.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2.2em 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #1f1f1d;font-size:14px;line-height:1.65;color:#c9c9c4\"><span style=\"color:#6a6a66\">⊢<\u002Fspan><span>Reinforcement learning or reward modelling in a real system, not a notebook.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2.2em 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #1f1f1d;font-size:14px;line-height:1.65;color:#c9c9c4\"><span style=\"color:#6a6a66\">⊢<\u002Fspan><span>You write fast, correct infrastructure — data, eval, serving — and you ship.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2.2em 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #1f1f1d;font-size:14px;line-height:1.65;color:#c9c9c4\"><span style=\"color:#6a6a66\">⊢<\u002Fspan><span>Comfort with formal methods or the will to acquire it in a month.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p data-m=\"fine\" style=\"margin:0;font-size:12px;line-height:1.7;color:#6a6a66;max-width:460px;text-wrap:pretty\">Remote or with us. Stealth. We only take the best — the bar is what you have shipped or proved, not where you have been.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-m=\"pfoot\" style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;font-size:11px;letter-spacing:.06em;color:#6a6a66\"><span>© 2026 Millennium Research<\u002Fspan><span>Re(s) = 1/2, until proven otherwise.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ is_gtm }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-m=\"shell\" style=\"min-height:100vh;background:#000;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,4vw,28px) clamp(20px,4vw,32px) 34px;gap:clamp(28px,5vw,40px)\">\n  <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66\">\n    <a href=\"#home\" style=\"color:#f2f2ee\">← Millennium Research<\u002Fa>\n    <span data-m=\"nav\" style=\"display:flex;gap:28px\"><a href=\"#work\" style=\"color:#f2f2ee\" style-hover=\"color:#f2f2ee\">Work<\u002Fa><a href=\"#fellowship\" style=\"color:#6a6a66\" style-hover=\"color:#f2f2ee\">Fellowship<\u002Fa><a href=\"#convexity\" style=\"color:#6a6a66\" style-hover=\"color:#f2f2ee\">Convexity<\u002Fa><\u002Fspan>\n  <\u002Fdiv>\n  <div data-m=\"cols\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(36px,6vw,110px);align-content:center;max-width:1400px;width:100%;margin:0 auto;animation:jbIn .6s both\">\n    <div style=\"display:grid;gap:26px;align-content:start\">\n      <a href=\"#work\" style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66\" style-hover=\"color:#f2f2ee\">← all roles<\u002Fa>\n      <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66\">founding · labs &amp; partners<\u002Fspan>\n      <h1 style=\"margin:0;font-weight:300;font-size:clamp(30px,3.6vw,56px);line-height:1.12;letter-spacing:-.03em;text-wrap:balance\">Go‑to‑Market<\u002Fh1>\n      <p style=\"margin:0;font-size:15px;line-height:1.75;color:#a8a8a2;text-wrap:pretty;max-width:520px\">You will be the first commercial person at a stealth research lab. You find the labs and teams training on verified reasoning, run pilots to a scored result, and turn a research advantage into a business without diluting the science.<\u002Fp>\n      <div data-m=\"pay\" style=\"display:flex;gap:28px;align-items:baseline;padding:18px 0;border-top:1px solid #1f1f1d;border-bottom:1px solid #1f1f1d\"><span style=\"font-size:clamp(26px,2.6vw,38px);letter-spacing:-.03em;color:#f2f2ee;white-space:nowrap\">Up to $250,000<\u002Fspan><span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a8a86\">+ equity<\u002Fspan><\u002Fdiv>\n      <a data-m=\"cta\" href=\"mailto:shayaan@millenniumresearch.ai?subject=Go%E2%80%91to%E2%80%91Market%20%E2%80%94%20Millennium%20Research\" style=\"justify-self:start;font-size:13px;letter-spacing:.06em;padding:14px 20px;border:1px solid #f2f2ee\" style-hover=\"background:#f2f2ee;color:#000\">Send one deal you are proud of and why →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:28px;align-content:start;padding-top:6px\">\n      <div style=\"display:grid;gap:18px;padding:22px;border:1px solid #1f1f1d\">\n        <div data-m=\"cardhead\" style=\"display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66\"><span>a pilot<\u002Fspan><span>six weeks<\u002Fspan><\u002Fdiv>\n        <div style=\"position:relative;height:60px\">\n          <div style=\"position:absolute;left:6px;right:6px;top:10px;height:1px;background:#1f1f1d\"><\u002Fdiv>\n          <div style=\"position:absolute;left:6px;right:6px;top:10px;height:1px;background:linear-gradient(90deg,#f2f2ee,#f2f2ee 68%,transparent 68%)\"><\u002Fdiv>\n          <div style=\"position:absolute;left:0;top:5px;width:11px;height:11px;border-radius:50%;background:#f2f2ee\"><\u002Fdiv>\n          <div style=\"position:absolute;left:calc(34% - 5px);top:5px;width:11px;height:11px;border-radius:50%;background:#f2f2ee\"><\u002Fdiv>\n          <div style=\"position:absolute;left:calc(68% - 5px);top:5px;width:11px;height:11px;border-radius:50%;background:#f2f2ee\"><\u002Fdiv>\n          <div style=\"position:absolute;right:0;top:5px;width:11px;height:11px;border-radius:50%;border:1px solid #6a6a66;background:#000\"><\u002Fdiv>\n          <div style=\"position:absolute;left:0;top:30px;font-size:10px;letter-spacing:.1em;color:#f2f2ee\">wk 0<\u002Fdiv>\n          <div style=\"position:absolute;left:34%;top:30px;font-size:10px;letter-spacing:.1em;color:#f2f2ee\">wk 1<\u002Fdiv>\n          <div style=\"position:absolute;left:68%;top:30px;font-size:10px;letter-spacing:.1em;color:#f2f2ee\">wk 4<\u002Fdiv>\n          <div style=\"position:absolute;right:0;top:30px;font-size:10px;letter-spacing:.1em;color:#6a6a66;text-align:right\">wk 6<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:6px;font-size:11px;line-height:1.6;color:#8a8a86\">\n          <div style=\"display:grid;grid-template-columns:4ch 1fr;gap:12px\"><span style=\"color:#f2f2ee\">wk 0<\u002Fspan><span>what are you training<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:4ch 1fr;gap:12px\"><span style=\"color:#f2f2ee\">wk 1<\u002Fspan><span>sample shard under NDA<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:4ch 1fr;gap:12px\"><span style=\"color:#f2f2ee\">wk 4<\u002Fspan><span>their model, scored on our corpus<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:4ch 1fr;gap:12px\"><span style=\"color:#6a6a66\">wk 6<\u002Fspan><span>contract<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.7;color:#8a8a86;padding-top:6px;border-top:1px solid #1f1f1d\">Nobody buys verified reasoning off a deck. They buy a number their own model produced on our corpus. You run that motion, end to end, from a cold start.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:18px\">\n      <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66\">the bar · all required<\u002Fspan>\n      <div style=\"display:grid;border-top:1px solid #1f1f1d\">\n        <div style=\"display:grid;grid-template-columns:2.2em 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #1f1f1d;font-size:14px;line-height:1.65;color:#c9c9c4\"><span style=\"color:#6a6a66\">⊢<\u002Fspan><span>You have sold or partnered deeply technical work to research or ML teams — and can name the deals.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2.2em 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #1f1f1d;font-size:14px;line-height:1.65;color:#c9c9c4\"><span style=\"color:#6a6a66\">⊢<\u002Fspan><span>You can hold a conversation with a formal methods researcher and a CFO on the same day.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2.2em 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #1f1f1d;font-size:14px;line-height:1.65;color:#c9c9c4\"><span style=\"color:#6a6a66\">⊢<\u002Fspan><span>You write clearly. A one‑page memo from you moves a decision.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:2.2em 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #1f1f1d;font-size:14px;line-height:1.65;color:#c9c9c4\"><span style=\"color:#6a6a66\">⊢<\u002Fspan><span>Zero‑to‑one: you have built the playbook, not run one.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p data-m=\"fine\" style=\"margin:0;font-size:12px;line-height:1.7;color:#6a6a66;max-width:460px;text-wrap:pretty\">Remote or with us. Stealth. We only take the best — the bar is what you have shipped or proved, not where you have been.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-m=\"pfoot\" style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;font-size:11px;letter-spacing:.06em;color:#6a6a66\"><span>© 2026 Millennium Research<\u002Fspan><span>Re(s) = 1/2, until proven otherwise.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ is_fellowship }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-m=\"page\" data-p=\"fc\" style=\"position:fixed;inset:0;background:#000;user-select:none\">\n  <canvas id=\"fc-gl\" style=\"position:fixed;inset:0;width:100vw;height:100vh;z-index:0\"><\u002Fcanvas>\n\n  <div data-m=\"topnav\" style=\"position:absolute;top:28px;left:20px;right:20px;z-index:5;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66;pointer-events:none\">\n    <a href=\"#home\" style=\"color:#f2f2ee;pointer-events:auto\">← Millennium Research<\u002Fa>\n    <span data-m=\"nav\" style=\"display:flex;gap:28px\"><a href=\"#work\" style=\"color:#6a6a66;pointer-events:auto\" style-hover=\"color:#f2f2ee\">Work<\u002Fa><span style=\"color:#f2f2ee\">Fellowship<\u002Fspan><a href=\"#convexity\" style=\"color:#6a6a66;pointer-events:auto\" style-hover=\"color:#f2f2ee\">Convexity<\u002Fa><\u002Fspan>\n  <\u002Fdiv>\n\n  <div data-m=\"water-hero\" style=\"position:absolute;left:32px;top:0;bottom:0;display:grid;align-content:center;width:min(560px,60vw);pointer-events:none;z-index:2\"><div style=\"display:grid;gap:26px;animation:fcIn 1.1s .2s both\">\n    <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66\">the millennium fellowship<\u002Fspan>\n    <h1 style=\"margin:0;font-weight:300;font-size:clamp(30px,3.6vw,58px);line-height:1.1;letter-spacing:-.035em;text-wrap:balance\">A year to prove one thing nobody has.<\u002Fh1>\n    <p style=\"margin:0;font-size:14px;line-height:1.75;color:#8a8a86;text-wrap:pretty;max-width:460px\">Most of the field takes small steps. We fund the leap. One open problem, one year, up to $100,000 — every step checked by machine. Very few are taken.<\u002Fp>\n    <a data-m=\"cta\" href=\"mailto:shayaan@millenniumresearch.ai?subject=Millennium%20Fellowship\" style=\"justify-self:start;font-size:13px;letter-spacing:.06em;padding:14px 20px;border:1px solid #f2f2ee;pointer-events:auto\" style-hover=\"background:#f2f2ee;color:#000\">Propose a problem →<\u002Fa>\n  <\u002Fdiv><\u002Fdiv>\n\n  <div data-m=\"foot\" style=\"position:absolute;bottom:34px;left:32px;right:32px;z-index:2;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;font-size:11px;letter-spacing:.06em;color:#6a6a66;pointer-events:none\"><span>© 2026 Millennium Research<\u002Fspan><span>Re(s) = 1/2, until proven otherwise.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ is_convexity }}\" hint-placeholder-val=\"{{ false }}\">\n<div id=\"cv-stage\" data-m=\"page\" data-p=\"cv\" style=\"position:fixed;inset:0;background:#000;user-select:none\">\n  <canvas id=\"cv-curve\" data-m=\"curve\" style=\"position:absolute;inset:0;width:100vw;height:100vh\"><\u002Fcanvas>\n\n  <div data-m=\"topnav\" style=\"position:absolute;top:28px;left:20px;right:20px;z-index:5;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66;pointer-events:none\">\n    <a href=\"#home\" style=\"color:#f2f2ee;pointer-events:auto\">← Millennium Research<\u002Fa>\n    <span data-m=\"nav\" style=\"display:flex;gap:28px\"><a href=\"#work\" style=\"color:#6a6a66;pointer-events:auto\" style-hover=\"color:#f2f2ee\">Work<\u002Fa><a href=\"#fellowship\" style=\"color:#6a6a66;pointer-events:auto\" style-hover=\"color:#f2f2ee\">Fellowship<\u002Fa><span style=\"color:#f2f2ee\">Convexity<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n\n  <div data-m=\"hero\" style=\"position:absolute;left:32px;top:50%;transform:translateY(-50%);width:min(440px,40vw);display:grid;gap:26px;pointer-events:none;animation:cvIn 1.2s .3s both\">\n    <div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6a6a66\">convexity · a fund<\u002Fdiv>\n    <h1 style=\"margin:0;font-weight:300;font-size:clamp(26px,2.8vw,44px);line-height:1.2;letter-spacing:-.03em;text-wrap:balance\">Tell us the impossible thing.<\u002Fh1>\n    <p style=\"margin:0;font-size:14px;line-height:1.7;color:#8a8a86;text-wrap:pretty\">Most bets pay in a straight line. We only want the ones that bend — where being wrong costs almost nothing and being right changes a field. New mathematics, verified systems, quantum, machines that do science. If everyone you have pitched has said no, you are probably in the right place.<\u002Fp>\n    <a data-m=\"cta\" href=\"mailto:shayaan@millenniumresearch.ai?subject=Convexity%20%E2%80%94%20the%20impossible%20thing\" style=\"justify-self:start;font-size:13px;letter-spacing:.06em;padding:14px 20px;border:1px solid #f2f2ee;pointer-events:auto\" style-hover=\"background:#f2f2ee;color:#000\">Send the impossible thing →<\u002Fa>\n  <\u002Fdiv>\n\n  <div data-m=\"cv-label\" style=\"position:absolute;left:{{ px }};top:{{ py }};transform:{{ tx }};text-align:{{ ta }};font-size:11px;letter-spacing:.06em;color:#f2f2ee;pointer-events:none;white-space:nowrap;display:grid;gap:4px;transition:left .06s linear,top .06s linear\">\n    <span style=\"color:#6a6a66\">{{ label }}<\u002Fspan>\n    <span>{{ payoff }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <div data-m=\"foot\" style=\"position:absolute;bottom:34px;left:32px;right:32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;font-size:11px;letter-spacing:.06em;color:#6a6a66;pointer-events:none\">\n    <span>{{ hint }}<\u002Fspan>\n    <span>f(λx + (1−λ)y) ≤ λf(x) + (1−λ)f(y)<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  // Real-time shallow-water surface: 2D wave equation on the GPU (ping-pong RGBA16F),\n// specular-only shading for black water, dye field for the emerald flood.\ncreateWater(canvas) {\n  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false });\n  if (!gl) return null;\n  if (!gl.getExtension('EXT_color_buffer_float')) return null;\n  gl.getExtension('OES_texture_float_linear');\n\n  const VS = `#version 300 es\n  in vec2 p; out vec2 vUv; void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0,1); }`;\n\n  const STEP = `#version 300 es\n  precision highp float; in vec2 vUv; out vec4 o;\n  uniform sampler2D uPrev; uniform vec2 uTexel; uniform float uAspect; uniform float uDamp; uniform float uC;\n  uniform vec4 uDrops[16]; uniform float uDropDye[16]; uniform int uDropCount;\n  uniform vec3 uPads[8]; uniform int uPadCount;\n  void main(){\n    vec4 c = texture(uPrev, vUv);\n    vec4 n = texture(uPrev, vUv + vec2(0.0, uTexel.y));\n    vec4 s = texture(uPrev, vUv - vec2(0.0, uTexel.y));\n    vec4 e = texture(uPrev, vUv + vec2(uTexel.x, 0.0));\n    vec4 w = texture(uPrev, vUv - vec2(uTexel.x, 0.0));\n    float lap = (n.r + s.r + e.r + w.r) * 0.25 - c.r;\n    float v = (c.g + lap * uC) * uDamp;\n    float h = c.r + v;\n    float dye = mix(c.b, (n.b + s.b + e.b + w.b) * 0.25, 0.45);\n    vec2 P = vec2(vUv.x * uAspect, vUv.y);\n    for (int i = 0; i < 16; i++) {\n      if (i >= uDropCount) break;\n      vec4 d = uDrops[i];\n      float dist = distance(P, vec2(d.x * uAspect, d.y));\n      float q = dist / d.z;\n      if (q < 1.6) { float g = exp(-q*q*2.2); h += d.w * g * (1.0 - 1.6*q*q); dye += uDropDye[i] * g; }\n    }\n    for (int i = 0; i < 8; i++) {\n      if (i >= uPadCount) break;\n      vec3 pd = uPads[i];\n      if (distance(P, vec2(pd.x * uAspect, pd.y)) < pd.z) { h *= 0.2; v *= 0.2; }\n    }\n    // soft absorbing border\n    float bx = min(vUv.x, 1.0 - vUv.x), by = min(vUv.y, 1.0 - vUv.y);\n    float border = smoothstep(0.0, 0.04, min(bx, by));\n    h *= mix(0.9, 1.0, border); v *= mix(0.9, 1.0, border);\n    o = vec4(h, v, clamp(dye, 0.0, 1.0), 1.0);\n  }`;\n\n  const RENDER = `#version 300 es\n  precision highp float; in vec2 vUv; out vec4 o;\n  uniform sampler2D uSim; uniform vec2 uTexel; uniform float uAspect; uniform float uTime; uniform float uSlope;\n  uniform vec4 uDye; // x,y center (uv), z radius (uv, aspect-corrected), w strength\n  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\n  float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);\n    return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }\n  float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }\n  void main(){\n    vec4 c = texture(uSim, vUv);\n    float e = texture(uSim, vUv + vec2(uTexel.x, 0.0)).r, w = texture(uSim, vUv - vec2(uTexel.x, 0.0)).r;\n    float n = texture(uSim, vUv + vec2(0.0, uTexel.y)).r, s = texture(uSim, vUv - vec2(0.0, uTexel.y)).r;\n    vec2 g = vec2(e - w, n - s) * uSlope;\n    // micro swell so still water still breathes\n    vec2 P = vec2(vUv.x * uAspect, vUv.y);\n    g += 0.10 * vec2(sin(P.x*5.0 + uTime*0.45 + sin(P.y*3.0 + uTime*0.2)), cos(P.y*4.0 - uTime*0.32 + sin(P.x*2.5)));\n    g += 0.05 * vec2(sin(P.x*11.0 - P.y*6.0 + uTime*0.9), cos(P.y*9.0 + P.x*4.0 - uTime*0.7));\n    g += 0.025 * vec2(sin(P.x*23.0 + P.y*13.0 + uTime*1.6), cos(P.y*19.0 - P.x*9.0 + uTime*1.3));\n    g += 0.03 * (vec2(fbm(P*4.0 + uTime*0.12), fbm(P*4.0 - uTime*0.1)) - 0.5);\n    vec3 N = normalize(vec3(-g, 1.0));\n    vec3 V = vec3(0.0, 0.0, 1.0);\n    vec3 L1 = normalize(vec3(-0.35, 0.55, 0.75));\n    vec3 L2 = normalize(vec3(0.6, -0.4, 0.7));\n    float sp1 = pow(max(dot(N, normalize(L1 + V)), 0.0), 90.0) * 0.9;\n    float sp2 = pow(max(dot(N, normalize(L2 + V)), 0.0), 70.0) * 0.28;\n    float sheen = pow(max(dot(N, normalize(L1 + V)), 0.0)
